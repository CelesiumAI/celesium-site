<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
  <defs>
    <linearGradient id="qr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2748"/>
      <stop offset="100%" stop-color="#0D1224"/>
    </linearGradient>
    <radialGradient id="qr-spot" cx="0.75" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#22F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22F0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="240" fill="url(#qr-bg)"/>
  <rect width="600" height="240" fill="url(#qr-spot)"/>

  <!-- Expert witness reliability — Daubert factors scored -->

  <!-- LEFT: expert dossier card -->
  <g transform="translate(36, 38)">
    <rect x="0" y="0" width="170" height="164" fill="#1A2244" stroke="#2E3865" stroke-width="1" rx="3"/>
    <text x="12" y="20" font-family="ui-monospace,monospace" font-size="9" letter-spacing="0.12em" fill="#22F0FF">EXPERT DOSSIER</text>
    <line x1="12" y1="28" x2="158" y2="28" stroke="#2E3865" stroke-width="1"/>

    <text x="12" y="46" font-family="ui-monospace,monospace" font-size="11" fill="#FFFFFF">Dr. M. Reyes</text>
    <text x="12" y="60" font-family="ui-monospace,monospace" font-size="8.5" fill="#8E96B5">Biomechanics · MD/PhD</text>

    <g font-family="ui-monospace,monospace" font-size="8" fill="#DCE0EE">
      <text x="12" y="84">depositions</text>     <text x="158" y="84" text-anchor="end" fill="#FFFFFF">142</text>
      <text x="12" y="100">trial testimony</text> <text x="158" y="100" text-anchor="end" fill="#FFFFFF">38</text>
      <text x="12" y="116">peer pubs</text>      <text x="158" y="116" text-anchor="end" fill="#FFFFFF">71</text>
      <text x="12" y="132">excl. rulings</text>  <text x="158" y="132" text-anchor="end" fill="#FFC661">3</text>
      <text x="12" y="148">contradictions</text> <text x="158" y="148" text-anchor="end" fill="#FFC661">5</text>
    </g>
  </g>

  <!-- Connector pulse -->
  <g stroke="#2E3865" stroke-width="1" fill="none">
    <path d="M 210,120 C 240,120 240,80 280,80"/>
    <path d="M 210,120 C 240,120 240,120 280,120"/>
    <path d="M 210,120 C 240,120 240,160 280,160"/>
  </g>
  <circle r="3" fill="#22F0FF">
    <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#qr-flow"/>
    </animateMotion>
  </circle>
  <path id="qr-flow"
        d="M 210,120 C 240,120 240,80 280,80 L 410,80"
        fill="none" stroke="none"/>

  <!-- MIDDLE: Daubert factor evaluators -->
  <g font-family="ui-monospace,monospace" font-size="8.5">
    <g transform="translate(280, 72)">
      <rect x="0" y="0" width="100" height="18" fill="#2A345C" rx="2"/>
      <text x="8" y="12" fill="#DCE0EE" letter-spacing="0.05em">TESTABILITY</text>
    </g>
    <g transform="translate(280, 112)">
      <rect x="0" y="0" width="100" height="18" fill="#2A345C" rx="2"/>
      <text x="8" y="12" fill="#DCE0EE" letter-spacing="0.05em">PEER REVIEW</text>
    </g>
    <g transform="translate(280, 152)">
      <rect x="0" y="0" width="100" height="18" fill="#2A345C" rx="2"/>
      <text x="8" y="12" fill="#DCE0EE" letter-spacing="0.05em">ERROR RATE</text>
    </g>
  </g>

  <!-- RIGHT: reliability score panel -->
  <g transform="translate(410, 30)" font-family="ui-monospace,monospace" font-size="9.5" fill="#DCE0EE">
    <text x="0" y="0" font-size="10" letter-spacing="0.12em" fill="#22F0FF">DAUBERT INDEX</text>

    <g transform="translate(0, 18)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">METHOD</text>
      <rect x="56" y="2" width="84" height="6" fill="#2E3865" rx="1"/>
      <rect x="56" y="2" width="70" height="6" fill="#22F0FF" rx="1"/>
      <text x="146" y="9" font-size="8.5" fill="#FFFFFF">82</text>
    </g>
    <g transform="translate(0, 38)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">PEER REV</text>
      <rect x="56" y="2" width="84" height="6" fill="#2E3865" rx="1"/>
      <rect x="56" y="2" width="76" height="6" fill="#22F0FF" rx="1"/>
      <text x="146" y="9" font-size="8.5" fill="#FFFFFF">88</text>
    </g>
    <g transform="translate(0, 58)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">ERROR</text>
      <rect x="56" y="2" width="84" height="6" fill="#2E3865" rx="1"/>
      <rect x="56" y="2" width="50" height="6" fill="#FFC661" rx="1"/>
      <text x="146" y="9" font-size="8.5" fill="#FFFFFF">59</text>
    </g>
    <g transform="translate(0, 78)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">ACCEPTED</text>
      <rect x="56" y="2" width="84" height="6" fill="#2E3865" rx="1"/>
      <rect x="56" y="2" width="72" height="6" fill="#22F0FF" rx="1"/>
      <text x="146" y="9" font-size="8.5" fill="#FFFFFF">85</text>
    </g>

    <line x1="0" y1="100" x2="160" y2="100" stroke="#2E3865" stroke-width="1"/>

    <g transform="translate(0, 120)">
      <text x="0" y="0" font-size="8.5" letter-spacing="0.1em" fill="#22F0FF">RELIABILITY</text>
      <text x="0" y="22" font-size="22" font-weight="500" fill="#FFFFFF">ADMIT</text>
      <text x="0" y="38" font-size="8" fill="#8E96B5">CONFIDENCE: HIGH</text>
    </g>

    <line x1="0" y1="160" x2="160" y2="160" stroke="#2E3865" stroke-width="1"/>
    <text x="0" y="178" font-size="8" letter-spacing="0.1em" fill="#8E96B5">DAUBERT · FRE 702 · KUMHO</text>
  </g>
</svg>
