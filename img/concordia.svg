<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
  <defs>
    <linearGradient id="cn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2748"/>
      <stop offset="100%" stop-color="#0D1224"/>
    </linearGradient>
    <radialGradient id="cn-spot" cx="0.7" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#22F0FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22F0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="240" fill="url(#cn-bg)"/>
  <rect width="600" height="240" fill="url(#cn-spot)"/>

  <!-- Faint chart grid -->
  <g stroke="#2E3865" stroke-width="0.4" opacity="0.4">
    <line x1="40" y1="50" x2="380" y2="50"/>
    <line x1="40" y1="100" x2="380" y2="100"/>
    <line x1="40" y1="150" x2="380" y2="150"/>
    <line x1="40" y1="200" x2="380" y2="200"/>
  </g>

  <!-- Y-axis tick labels -->
  <g font-family="ui-monospace,monospace" font-size="8" fill="#5A6182" text-anchor="end">
    <text x="36" y="53">$240</text>
    <text x="36" y="103">$220</text>
    <text x="36" y="153">$200</text>
    <text x="36" y="203">$180</text>
  </g>

  <!-- Trend line behind candles -->
  <path d="M 60,170 L 90,165 L 120,155 L 150,150 L 180,140 L 210,135 L 240,120 L 270,115 L 300,100 L 330,95 L 360,80"
        fill="none" stroke="#22F0FF" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 3"/>

  <!-- Candlesticks -->
  <g>
    <!-- bullish: cyan; bearish: dim -->
    <g stroke-width="1">
      <!-- 1 bull -->
      <line x1="60" y1="180" x2="60" y2="155" stroke="#22F0FF"/>
      <rect x="55" y="160" width="10" height="15" fill="#22F0FF" opacity="0.7"/>
      <!-- 2 bear -->
      <line x1="90" y1="170" x2="90" y2="148" stroke="#5A6182"/>
      <rect x="85" y="155" width="10" height="14" fill="#1E2748" stroke="#5A6182"/>
      <!-- 3 bull -->
      <line x1="120" y1="160" x2="120" y2="142" stroke="#22F0FF"/>
      <rect x="115" y="148" width="10" height="12" fill="#22F0FF" opacity="0.7"/>
      <!-- 4 bull -->
      <line x1="150" y1="155" x2="150" y2="138" stroke="#22F0FF"/>
      <rect x="145" y="142" width="10" height="13" fill="#22F0FF" opacity="0.7"/>
      <!-- 5 bear -->
      <line x1="180" y1="148" x2="180" y2="128" stroke="#5A6182"/>
      <rect x="175" y="135" width="10" height="13" fill="#1E2748" stroke="#5A6182"/>
      <!-- 6 bull -->
      <line x1="210" y1="140" x2="210" y2="120" stroke="#22F0FF"/>
      <rect x="205" y="125" width="10" height="15" fill="#22F0FF" opacity="0.7"/>
      <!-- 7 bull big -->
      <line x1="240" y1="135" x2="240" y2="105" stroke="#22F0FF"/>
      <rect x="235" y="110" width="10" height="22" fill="#22F0FF" opacity="0.85"/>
      <!-- 8 bear -->
      <line x1="270" y1="120" x2="270" y2="98" stroke="#5A6182"/>
      <rect x="265" y="105" width="10" height="15" fill="#1E2748" stroke="#5A6182"/>
      <!-- 9 bull -->
      <line x1="300" y1="115" x2="300" y2="88" stroke="#22F0FF"/>
      <rect x="295" y="92" width="10" height="20" fill="#22F0FF" opacity="0.85"/>
      <!-- 10 bull -->
      <line x1="330" y1="105" x2="330" y2="80" stroke="#22F0FF"/>
      <rect x="325" y="85" width="10" height="18" fill="#22F0FF" opacity="0.85"/>
      <!-- 11 bull strong -->
      <line x1="360" y1="92" x2="360" y2="65" stroke="#22F0FF"/>
      <rect x="355" y="68" width="10" height="22" fill="#22F0FF"/>
    </g>
  </g>

  <!-- Verification checkmark layer over a recent candle -->
  <g transform="translate(360, 50)">
    <circle r="11" fill="#0D1224" stroke="#22F0FF" stroke-width="1.5"/>
    <path d="M -4,0 L -1,3 L 5,-3" fill="none" stroke="#22F0FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- X-axis label -->
  <g font-family="ui-monospace,monospace" font-size="8" fill="#5A6182">
    <text x="60" y="220" letter-spacing="0.1em">Q1</text>
    <text x="150" y="220" letter-spacing="0.1em">Q2</text>
    <text x="240" y="220" letter-spacing="0.1em">Q3</text>
    <text x="330" y="220" letter-spacing="0.1em">Q4</text>
  </g>

  <!-- Top label -->
  <g transform="translate(40, 30)" font-family="ui-monospace,monospace" fill="#22F0FF">
    <text x="0" y="0" font-size="10" letter-spacing="0.12em">THESIS · LONG</text>
  </g>

  <!-- Right-side verification panel -->
  <g transform="translate(420, 40)" font-family="ui-monospace,monospace" fill="#DCE0EE">
    <text x="0" y="0" font-size="10" letter-spacing="0.12em" fill="#22F0FF">RED FLAG CHECK</text>

    <g transform="translate(0, 24)" font-size="9.5">
      <circle cx="5" cy="-3" r="3" fill="#4DEAA8"/>
      <text x="16" y="0" fill="#DCE0EE">Earnings quality</text>
    </g>
    <g transform="translate(0, 44)" font-size="9.5">
      <circle cx="5" cy="-3" r="3" fill="#4DEAA8"/>
      <text x="16" y="0" fill="#DCE0EE">Insider trading</text>
    </g>
    <g transform="translate(0, 64)" font-size="9.5">
      <circle cx="5" cy="-3" r="3" fill="#4DEAA8"/>
      <text x="16" y="0" fill="#DCE0EE">Dilution risk</text>
    </g>
    <g transform="translate(0, 84)" font-size="9.5">
      <circle cx="5" cy="-3" r="3" fill="#FFC661"/>
      <text x="16" y="0" fill="#DCE0EE">Catalyst timing</text>
    </g>
    <g transform="translate(0, 104)" font-size="9.5">
      <circle cx="5" cy="-3" r="3" fill="#4DEAA8"/>
      <text x="16" y="0" fill="#DCE0EE">Litigation</text>
    </g>

    <line x1="0" y1="124" x2="150" y2="124" stroke="#2E3865" stroke-width="1"/>

    <g transform="translate(0, 144)">
      <text x="0" y="0" font-size="9" letter-spacing="0.1em" fill="#22F0FF">VERDICT</text>
      <text x="0" y="22" font-size="20" font-weight="500" fill="#FFFFFF">APPROVED</text>
      <text x="0" y="38" font-size="8" fill="#8E96B5">5 / 5 AGENTS · 4.2/5 SCORE</text>
    </g>
  </g>
</svg>
