<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
  <defs>
    <linearGradient id="vn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2748"/>
      <stop offset="100%" stop-color="#0D1224"/>
    </linearGradient>
    <radialGradient id="vn-spot" cx="0.2" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#22F0FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22F0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="240" fill="url(#vn-bg)"/>
  <rect width="600" height="240" fill="url(#vn-spot)"/>

  <!-- Decision tree: input idea -> branching evaluation -> outcome scores -->

  <!-- Branches (drawn first) -->
  <g stroke="#2E3865" stroke-width="1" fill="none">
    <!-- Input to L1 -->
    <path d="M 100,120 C 130,120 130,55 165,55"/>
    <path d="M 100,120 C 130,120 130,95 165,95"/>
    <path d="M 100,120 C 130,120 130,145 165,145"/>
    <path d="M 100,120 C 130,120 130,185 165,185"/>

    <!-- L1 to L2 -->
    <path d="M 200,55 C 240,55 240,40 280,40" stroke="#22F0FF" opacity="0.5"/>
    <path d="M 200,55 C 240,55 240,75 280,75"/>

    <path d="M 200,95 C 240,95 240,110 280,110" stroke="#22F0FF" opacity="0.5"/>
    <path d="M 200,95 C 240,95 240,130 280,130"/>

    <path d="M 200,145 C 240,145 240,155 280,155"/>
    <path d="M 200,185 C 240,185 240,195 280,195" stroke="#22F0FF" opacity="0.5"/>

    <!-- L2 to outcome scores -->
    <path d="M 320,40 C 360,40 360,55 410,55" stroke="#22F0FF"/>
    <path d="M 320,75 C 360,75 360,90 410,90"/>
    <path d="M 320,110 C 360,110 360,125 410,125"/>
    <path d="M 320,130 C 360,130 360,160 410,160"/>
    <path d="M 320,155 C 360,155 360,195 410,195"/>
    <path d="M 320,195 C 360,195 360,225 410,225"/>
  </g>

  <!-- Pulse traveling down active branch -->
  <circle r="3" fill="#22F0FF">
    <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#vn-active-path"/>
    </animateMotion>
  </circle>
  <path id="vn-active-path"
        d="M 100,120 C 130,120 130,55 165,55 L 200,55 C 240,55 240,40 280,40 L 320,40 C 360,40 360,55 410,55"
        fill="none" stroke="none"/>

  <!-- Input node -->
  <g transform="translate(100, 120)">
    <circle r="18" fill="#1E2748" stroke="#22F0FF" stroke-width="1.5"/>
    <text y="-26" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
          fill="#22F0FF" letter-spacing="0.1em">INPUT</text>
    <text y="4" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
          fill="#FFFFFF">IP</text>
  </g>

  <!-- L1 evaluation criteria -->
  <g font-family="ui-monospace,monospace" font-size="8.5" fill="#DCE0EE">
    <g transform="translate(180, 55)">
      <rect x="-15" y="-8" width="40" height="16" fill="#2A345C" rx="2"/>
      <text x="-10" y="3.5" font-size="8" letter-spacing="0.05em">VIABLE</text>
    </g>
    <g transform="translate(180, 95)">
      <rect x="-15" y="-8" width="40" height="16" fill="#2A345C" rx="2"/>
      <text x="-10" y="3.5" font-size="8" letter-spacing="0.05em">MARKET</text>
    </g>
    <g transform="translate(180, 145)">
      <rect x="-15" y="-8" width="40" height="16" fill="#2A345C" rx="2"/>
      <text x="-10" y="3.5" font-size="8" letter-spacing="0.05em">REG'Y</text>
    </g>
    <g transform="translate(180, 185)">
      <rect x="-15" y="-8" width="40" height="16" fill="#2A345C" rx="2"/>
      <text x="-10" y="3.5" font-size="8" letter-spacing="0.05em">TEAM</text>
    </g>
  </g>

  <!-- L2 sub-criteria nodes -->
  <g>
    <circle cx="295" cy="40" r="4" fill="#22F0FF"/>
    <circle cx="295" cy="75" r="3" fill="#1E2748" stroke="#8E96B5" stroke-width="1"/>
    <circle cx="295" cy="110" r="4" fill="#22F0FF"/>
    <circle cx="295" cy="130" r="3" fill="#1E2748" stroke="#8E96B5" stroke-width="1"/>
    <circle cx="295" cy="155" r="3" fill="#1E2748" stroke="#8E96B5" stroke-width="1"/>
    <circle cx="295" cy="195" r="4" fill="#22F0FF"/>
  </g>

  <!-- Output: scoring panel -->
  <g transform="translate(420, 30)" font-family="ui-monospace,monospace" font-size="9.5" fill="#DCE0EE">
    <text x="0" y="0" font-size="10" letter-spacing="0.12em" fill="#22F0FF">EVAL SCORE</text>

    <!-- Score bars -->
    <g transform="translate(0, 18)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">VIABILITY</text>
      <rect x="60" y="2" width="80" height="6" fill="#2E3865" rx="1"/>
      <rect x="60" y="2" width="68" height="6" fill="#22F0FF" rx="1"/>
      <text x="146" y="9" font-size="8.5" fill="#FFFFFF">85</text>
    </g>
    <g transform="translate(0, 38)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">MARKET</text>
      <rect x="60" y="2" width="80" height="6" fill="#2E3865" rx="1"/>
      <rect x="60" y="2" width="56" height="6" fill="#22F0FF" rx="1"/>
      <text x="146" y="9" font-size="8.5" fill="#FFFFFF">72</text>
    </g>
    <g transform="translate(0, 58)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">REG PATH</text>
      <rect x="60" y="2" width="80" height="6" fill="#2E3865" rx="1"/>
      <rect x="60" y="2" width="48" height="6" fill="#FFC661" rx="1"/>
      <text x="146" y="9" font-size="8.5" fill="#FFFFFF">61</text>
    </g>
    <g transform="translate(0, 78)">
      <text x="0" y="9" font-size="8.5" fill="#8E96B5">TEAM</text>
      <rect x="60" y="2" width="80" height="6" fill="#2E3865" rx="1"/>
      <rect x="60" y="2" width="72" height="6" fill="#22F0FF" rx="1"/>
      <text x="146" y="9" font-size="8.5" fill="#FFFFFF">90</text>
    </g>

    <line x1="0" y1="100" x2="160" y2="100" stroke="#2E3865" stroke-width="1"/>

    <g transform="translate(0, 120)">
      <text x="0" y="0" font-size="8.5" letter-spacing="0.1em" fill="#22F0FF">RECOMMEND</text>
      <text x="0" y="22" font-size="22" font-weight="500" fill="#FFFFFF">SPINOUT</text>
      <text x="0" y="38" font-size="8" fill="#8E96B5">CONFIDENCE: HIGH</text>
    </g>

    <line x1="0" y1="160" x2="160" y2="160" stroke="#2E3865" stroke-width="1"/>
    <text x="0" y="178" font-size="8" letter-spacing="0.1em" fill="#8E96B5">BCM · RICE · MD ANDERSON</text>
  </g>
</svg>
