<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;">
  <defs>
    <linearGradient id="ix-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2748"/>
      <stop offset="100%" stop-color="#0D1224"/>
    </linearGradient>
    <radialGradient id="ix-spot" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#22F0FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22F0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="ix-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="240" fill="url(#ix-bg)"/>
  <rect width="600" height="240" fill="url(#ix-spot)"/>

  <!-- Edges (drawn before nodes) -->
  <g stroke="#2E3865" stroke-width="0.8" fill="none" opacity="0.7">
    <!-- Center node connections -->
    <line x1="300" y1="120" x2="180" y2="60"/>
    <line x1="300" y1="120" x2="200" y2="180"/>
    <line x1="300" y1="120" x2="420" y2="80"/>
    <line x1="300" y1="120" x2="440" y2="170"/>
    <line x1="300" y1="120" x2="380" y2="50"/>
    <line x1="300" y1="120" x2="160" y2="120"/>
    <!-- Cross-connections -->
    <line x1="180" y1="60" x2="380" y2="50" stroke="#22F0FF" stroke-width="0.5" opacity="0.4"/>
    <line x1="180" y1="60" x2="160" y2="120"/>
    <line x1="200" y1="180" x2="160" y2="120"/>
    <line x1="200" y1="180" x2="440" y2="170"/>
    <line x1="420" y1="80" x2="380" y2="50"/>
    <line x1="420" y1="80" x2="440" y2="170"/>
    <line x1="380" y1="50" x2="500" y2="40" stroke="#22F0FF" stroke-width="0.5" opacity="0.4"/>
    <line x1="500" y1="40" x2="540" y2="100"/>
    <line x1="540" y1="100" x2="440" y2="170"/>
    <line x1="160" y1="120" x2="80" y2="160"/>
    <line x1="80" y1="160" x2="200" y2="180"/>
  </g>

  <!-- Active edge animation -->
  <g stroke="#22F0FF" stroke-width="1" fill="none">
    <line x1="300" y1="120" x2="420" y2="80" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="60" x2="380" y2="50" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="180" x2="440" y2="170" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Nodes (entities) -->
  <g>
    <!-- Center hub: queried entity -->
    <circle cx="300" cy="120" r="14" fill="#22F0FF" filter="url(#ix-glow)"/>
    <circle cx="300" cy="120" r="14" fill="none" stroke="#22F0FF" stroke-width="1"/>
    <circle cx="300" cy="120" r="22" fill="none" stroke="#22F0FF" stroke-width="0.4" opacity="0.5">
      <animate attributeName="r" values="14;30;14" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <!-- First-degree entities -->
    <circle cx="180" cy="60" r="7" fill="#1E2748" stroke="#DCE0EE" stroke-width="1.2"/>
    <circle cx="200" cy="180" r="6" fill="#1E2748" stroke="#DCE0EE" stroke-width="1.2"/>
    <circle cx="420" cy="80" r="8" fill="#1E2748" stroke="#22F0FF" stroke-width="1.5"/>
    <circle cx="440" cy="170" r="6" fill="#1E2748" stroke="#DCE0EE" stroke-width="1.2"/>
    <circle cx="380" cy="50" r="7" fill="#1E2748" stroke="#DCE0EE" stroke-width="1.2"/>
    <circle cx="160" cy="120" r="6" fill="#1E2748" stroke="#DCE0EE" stroke-width="1.2"/>

    <!-- Second-degree entities -->
    <circle cx="500" cy="40" r="4" fill="#1E2748" stroke="#8E96B5" stroke-width="1"/>
    <circle cx="540" cy="100" r="4" fill="#1E2748" stroke="#8E96B5" stroke-width="1"/>
    <circle cx="80" cy="160" r="4" fill="#1E2748" stroke="#8E96B5" stroke-width="1"/>

    <!-- Highlighted/risky entity -->
    <circle cx="420" cy="80" r="3" fill="#22F0FF"/>
  </g>

  <!-- Coordinate / scan grid in corner -->
  <g transform="translate(40, 30)" font-family="ui-monospace,monospace" font-size="8" fill="#8E96B5" opacity="0.6">
    <text y="0" letter-spacing="0.1em">ENTITY GRAPH</text>
    <text y="14" letter-spacing="0.05em" fill="#22F0FF">DEPTH 2 · 13 NODES</text>
  </g>

  <!-- Right side classification key -->
  <g transform="translate(40, 200)" font-family="ui-monospace,monospace" font-size="8.5" fill="#DCE0EE">
    <g>
      <circle cx="4" cy="-3" r="3" fill="#22F0FF"/>
      <text x="14" y="0">SUBJECT</text>
    </g>
    <g transform="translate(85, 0)">
      <circle cx="4" cy="-3" r="3" fill="none" stroke="#DCE0EE" stroke-width="1.2"/>
      <text x="14" y="0" fill="#DCE0EE">DIRECT</text>
    </g>
    <g transform="translate(160, 0)">
      <circle cx="4" cy="-3" r="2" fill="none" stroke="#8E96B5" stroke-width="1"/>
      <text x="14" y="0" fill="#8E96B5">INDIRECT</text>
    </g>
  </g>
</svg>
